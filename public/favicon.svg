<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121929"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#05080e"/>
    </linearGradient>

    <!-- Primary Orange Glow Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="50%" stop-color="#ff9f1c"/>
      <stop offset="100%" stop-color="#f77f00"/>
    </linearGradient>

    <!-- Cyan Glow Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#48cae4"/>
      <stop offset="50%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>

    <!-- Metallic Car Body Gradient -->
    <linearGradient id="carBodyGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="45%" stop-color="#ff9f1c"/>
      <stop offset="85%" stop-color="#f77f00"/>
      <stop offset="100%" stop-color="#d62828"/>
    </linearGradient>

    <!-- Windshield Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#90e0ef" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0077b6" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base / App Icon Frame -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="url(#orangeGrad)" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Ambient Light Orbs -->
  <circle cx="120" cy="120" r="140" fill="url(#orangeGrad)" opacity="0.18" filter="url(#softGlow)"/>
  <circle cx="390" cy="380" r="130" fill="url(#cyanGrad)" opacity="0.15" filter="url(#softGlow)"/>

  <!-- Speed Lines & Tech Grid Accents -->
  <g opacity="0.25" stroke="url(#cyanGrad)" stroke-width="2" stroke-linecap="round">
    <line x1="60" y1="360" x2="160" y2="360" />
    <line x1="40" y1="380" x2="120" y2="380" />
    <line x1="380" y1="130" x2="450" y2="130" />
  </g>

  <!-- AI Sparkle / Star top right -->
  <g transform="translate(390, 110) scale(1.3)" filter="url(#glow)">
    <!-- 4-point AI Star -->
    <path d="M0,-24 Q0,0 24,0 Q0,0 0,24 Q0,0 -24,0 Q0,0 0,-24 Z" fill="url(#orangeGrad)"/>
    <circle cx="0" cy="0" r="4" fill="#ffffff"/>
  </g>
  <g transform="translate(435, 155) scale(0.7)" filter="url(#glow)">
    <path d="M0,-18 Q0,0 18,0 Q0,0 0,18 Q0,0 -18,0 Q0,0 0,-18 Z" fill="url(#cyanGrad)"/>
  </g>

  <!-- Modern Streamlined Car Silhouette -->
  <!-- Car Drop Shadow -->
  <ellipse cx="256" cy="365" rx="180" ry="24" fill="#000000" opacity="0.6" filter="url(#softGlow)"/>

  <!-- Underglow Neon Light -->
  <ellipse cx="256" cy="358" rx="160" ry="12" fill="url(#cyanGrad)" opacity="0.75" filter="url(#glow)"/>

  <!-- Main Car Body Group -->
  <g filter="url(#glow)">
    <!-- Cabin Roof & Windshield -->
    <path d="M140 270 
             C175 210, 220 180, 290 180 
             C350 180, 385 210, 400 270 
             Z" 
          fill="url(#glassGrad)" />

    <!-- Roof Pillar Accent -->
    <path d="M260 185 L275 185 L285 265 L270 265 Z" fill="#121929" opacity="0.6"/>

    <!-- Main Aerodynamic Body Chassis -->
    <path d="M 75 305 
             C 75 285, 100 275, 135 270 
             C 170 265, 230 255, 300 255 
             C 380 255, 415 270, 435 285 
             C 445 295, 450 310, 440 325 
             C 430 340, 400 345, 360 345
             C 355 345, 350 325, 335 320
             C 315 315, 290 325, 285 345
             L 200 345
             C 195 325, 170 315, 150 320
             C 135 325, 130 345, 125 345
             C 95 345, 75 330, 75 305 
             Z" 
          fill="url(#carBodyGrad)" />

    <!-- Body Highlight Stroke / Reflection Line -->
    <path d="M 85 295 Q 260 250 430 290" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="3" 
          stroke-linecap="round" 
          opacity="0.6"/>

    <!-- Modern LED Headlights (Cyan futuristic beam) -->
    <polygon points="420,290 445,295 435,305 410,298" fill="#ffffff" filter="url(#glow)"/>
    <polygon points="420,290 445,295 435,305 410,298" fill="url(#cyanGrad)"/>
    
    <!-- LED Taillights (Glowing Red/Orange) -->
    <polygon points="80,300 95,298 92,308 78,306" fill="#ff4d6d" filter="url(#glow)"/>

    <!-- Front Wheel (Right) -->
    <g transform="translate(345, 340)">
      <circle cx="0" cy="0" r="34" fill="#090d16" stroke="url(#orangeGrad)" stroke-width="4"/>
      <circle cx="0" cy="0" r="22" fill="#121929" stroke="url(#cyanGrad)" stroke-width="2"/>
      <circle cx="0" cy="0" r="10" fill="url(#orangeGrad)"/>
      <!-- Rim Spokes -->
      <line x1="0" y1="-20" x2="0" y2="20" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
      <line x1="-20" y1="0" x2="20" y2="0" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
    </g>

    <!-- Rear Wheel (Left) -->
    <g transform="translate(160, 340)">
      <circle cx="0" cy="0" r="34" fill="#090d16" stroke="url(#orangeGrad)" stroke-width="4"/>
      <circle cx="0" cy="0" r="22" fill="#121929" stroke="url(#cyanGrad)" stroke-width="2"/>
      <circle cx="0" cy="0" r="10" fill="url(#orangeGrad)"/>
      <!-- Rim Spokes -->
      <line x1="0" y1="-20" x2="0" y2="20" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
      <line x1="-20" y1="0" x2="20" y2="0" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
    </g>
  </g>

  <!-- AutoCrédito "AC" Emblem Badge at bottom center -->
  <g transform="translate(256, 440)">
    <rect x="-75" y="-18" width="150" height="36" rx="18" fill="rgba(18, 25, 41, 0.85)" stroke="url(#orangeGrad)" stroke-width="1.5"/>
    <text x="0" y="6" text-anchor="middle" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="16" letter-spacing="3" fill="#ffffff">
      AUTOCRÉDITO
    </text>
  </g>
</svg>
